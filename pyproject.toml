[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "over-the-shoulder-coder"
version = "0.1.0"
description = "A task-centered desktop coding and design collaborator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
mac = [
  "pyobjc-framework-Cocoa>=11,<13",
  "pyobjc-framework-Quartz>=11,<13",
  "pyobjc-framework-Security>=11,<13",
  "pyobjc-framework-ScreenCaptureKit>=11,<13",
  "pyobjc-framework-CoreMedia>=11,<13",
  "pyobjc-framework-libdispatch>=11,<13",
  "numpy>=2.2,<3", "sounddevice>=0.5,<1",
  "PyAutoGUI>=0.9.54,<1", "pytesseract>=0.3.13,<1",
  "mido>=1.3,<2", "python-rtmidi>=1.5,<2",
]
test = ["numpy>=2.2,<3"]
local-asr = ["mlx-audio>=0.2; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
otsc = "otsc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["otsc"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
