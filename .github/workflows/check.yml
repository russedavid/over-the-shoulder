name: Core behavior and evaluation contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install portable dependencies
        run: python -m pip install -e '.[test]' ruff
      - name: Behavior, provenance, security, and evaluator checks
        run: python -m unittest discover -s tests -v
      - name: Style and import checks
        run: ruff check ots.py otsc evals tests
      - name: Validate corpus and split separation without inference
        run: python ots.py eval
